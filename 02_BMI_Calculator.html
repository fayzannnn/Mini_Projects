<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
     <h1>BMI CALCULATOR</h1>   
    
    <div>
      <form>
        <label>enter your height in cm </label><input type="text" id="height" placeholder="enter height"/>
        <br>
        <br>
        <label>enter your weight in kg </label><input type="text" id="weight" placeholder="enter weight"/>
    
      <button type="submit">calculate</button>
    </div>
    <div id="result"></div>
    <div id="weight guide">
        <h3>WEIGHT GUIDE</h3>
        <p>under weigth = less than 18.6</p>
        <p>normal weigth = 18.6 and 24.9</p>
        <p>over weigth = greater than 24.9</p>
    </div>
       </form> 
       </div>   
</body>
<script>
  
 const form = document.querySelector("form") 
 
 form.addEventListener('submit',function(e){
    e.preventDefault();

    const height = Number(document.querySelector("#height").value)
    const weight = Number(document.querySelector("#weight").value)
    const result = (document.querySelector('#result'))

    if(height === 0||height<0||isNaN(height)){
        result.innerHTML = `please enter a valid height ${height}`
    }
    else if (weight === 0||weight<0||isNaN(weight)){
        result.innerHTML =`please enter a valid height ${weight}`
    }
    else{
        const bmi = (weight/((height*height)/10000)).toFixed(2)
        result.innerHTML = `<span>${bmi}</sapn>`
    

    let message = " "

    if(bmi < 18.6){
        message = 'underweight'
    }
    if(bmi > 24.9){
        message = 'overweight'
    }
    else{
        message = 'normal weight'
    }
     result.innerHTML=`<p> ${bmi}  ${message} </p>`
} 
});
</script>
</html>
